<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#07080b; }
  body { font-family:'Manrope', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#3ee6d1; text-decoration:none; }
  a:hover { color:#8ef6e9; }
  * { box-sizing:border-box; }
  input::placeholder { color:#5f6774; }
  input:focus { outline:none; border-color:#3ee6d1 !important; box-shadow:0 0 0 3px rgba(62,230,209,.14) !important; }
  @keyframes ce-pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(1.5); } }
</style>
</helmet>

<div style="min-height:100vh; background:#07080b; color:#f2f4f7; display:flex; align-items:center; justify-content:center; padding:40px 24px; position:relative; overflow:hidden; font-family:'Manrope',system-ui,sans-serif;">
  <div style="position:absolute; top:-220px; left:50%; width:820px; height:520px; transform:translateX(-50%); background:radial-gradient(50% 50% at 50% 50%, rgba(62,230,209,.14), rgba(79,124,255,.06) 55%, transparent 75%); pointer-events:none;"></div>

  <div style="position:relative; width:100%; max-width:440px;">
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px;">
      <div style="width:24px; height:24px; border-radius:7px; background:linear-gradient(140deg,#3ee6d1,#4f7cff); box-shadow:0 0 18px rgba(62,230,209,.45);"></div>
      <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.03em;">casteasy<span style="color:#6b7382;">.io</span></span>
    </div>

    <div style="border:1px solid #1e2128; border-radius:20px; padding:36px 32px 32px; background:rgba(13,15,19,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 40px 80px -40px rgba(0,0,0,.9);">
      <h1 style="font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:700; letter-spacing:-.04em; margin:0 0 8px; line-height:1.1;">Create your account</h1>
      <p style="margin:0 0 28px; font-size:15px; color:#8b93a1;">Start advertising in your community today.</p>

      <label for="ce-name" style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#8b93a1; margin-bottom:9px;">FULL NAME</label>
      <input id="ce-name" type="text" autocomplete="name" placeholder="Jane Smith" style="width:100%; padding:13px 15px; margin-bottom:20px; border:1px solid #23262e; border-radius:11px; background:#0b0d11; color:#f2f4f7; font-family:'Manrope',sans-serif; font-size:15px; transition:border-color .16s ease, box-shadow .16s ease;" />

      <label for="ce-email" style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#8b93a1; margin-bottom:9px;">EMAIL ADDRESS</label>
      <input id="ce-email" type="email" autocomplete="email" placeholder="you@example.com" style="width:100%; padding:13px 15px; margin-bottom:20px; border:1px solid #23262e; border-radius:11px; background:#0b0d11; color:#f2f4f7; font-family:'Manrope',sans-serif; font-size:15px; transition:border-color .16s ease, box-shadow .16s ease;" />

      <label for="ce-pass" style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#8b93a1; margin-bottom:9px;">PASSWORD</label>
      <div style="position:relative; margin-bottom:20px;">
        <input id="ce-pass" type="{{ passType }}" autocomplete="new-password" placeholder="Min. 8 characters" style="width:100%; padding:13px 46px 13px 15px; border:1px solid #23262e; border-radius:11px; background:#0b0d11; color:#f2f4f7; font-family:'Manrope',sans-serif; font-size:15px; transition:border-color .16s ease, box-shadow .16s ease;" />
        <button type="button" onClick="{{ togglePass }}" aria-label="Toggle password visibility" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:{{ passEye }}; cursor:pointer; transition:color .16s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <sc-if value="{{ showPass }}" hint-placeholder-val="{{ false }}"><line x1="3" y1="21" x2="21" y2="3"></line></sc-if>
          </svg>
        </button>
      </div>

      <label for="ce-confirm" style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#8b93a1; margin-bottom:9px;">CONFIRM PASSWORD</label>
      <div style="position:relative; margin-bottom:18px;">
        <input id="ce-confirm" type="{{ confirmType }}" autocomplete="new-password" placeholder="Re-enter password" style="width:100%; padding:13px 46px 13px 15px; border:1px solid #23262e; border-radius:11px; background:#0b0d11; color:#f2f4f7; font-family:'Manrope',sans-serif; font-size:15px; transition:border-color .16s ease, box-shadow .16s ease;" />
        <button type="button" onClick="{{ toggleConfirm }}" aria-label="Toggle password visibility" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:{{ confirmEye }}; cursor:pointer; transition:color .16s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}"><line x1="3" y1="21" x2="21" y2="3"></line></sc-if>
          </svg>
        </button>
      </div>

      <p style="margin:0 0 22px; font-size:13px; line-height:1.6; color:#7d8593;">By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>

      <button type="button" style="width:100%; padding:15px; border:0; border-radius:11px; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; color:#04100e; background:linear-gradient(180deg,#5cf0dd,#26cdb9); box-shadow:0 14px 40px -12px rgba(62,230,209,.55), inset 0 1px 0 rgba(255,255,255,.4); cursor:pointer;">Create account</button>

      <div style="display:flex; align-items:center; gap:14px; margin:24px 0;">
        <div style="flex:1; height:1px; background:#1e2128;"></div>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#5f6774;">OR</span>
        <div style="flex:1; height:1px; background:#1e2128;"></div>
      </div>

      <button type="button" style="width:100%; padding:14px; border:1px solid #23262e; border-radius:11px; background:rgba(255,255,255,.02); color:#e8ecf2; font-family:'Manrope',sans-serif; font-weight:600; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .16s ease, border-color .16s ease;" style-hover="background:rgba(255,255,255,.05); border-color:#2f333d;">
        <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8a10 10 0 0 1-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.3z"></path><path fill="#34A853" d="M24 46c6 0 11-2 14.5-5.2l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7A22 22 0 0 0 24 46z"></path><path fill="#FBBC05" d="M11.8 28.4a13.2 13.2 0 0 1 0-8.4v-5.7H4.5a22 22 0 0 0 0 19.8l7.3-5.7z"></path><path fill="#EA4335" d="M24 10.4c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 3.9 30 2 24 2 15.4 2 8 6.9 4.5 14.3l7.3 5.7c1.7-5.2 6.5-9.6 12.2-9.6z"></path></svg>
        Continue with Google
      </button>

      <p style="margin:26px 0 0; text-align:center; font-size:14px; color:#8b93a1;">Already have an account? <a href="./CastEZ Login.dc.html" style="font-weight:700;">Sign in</a></p>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:22px;">
      <span style="position:relative; display:flex; width:7px; height:7px;">
        <span style="position:absolute; inset:0; border-radius:999px; background:#3ee6d1; animation:ce-pulse 2s ease-in-out infinite;"></span>
        <span style="position:relative; width:7px; height:7px; border-radius:999px; background:#3ee6d1;"></span>
      </span>
      <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; color:#5f6774;">NETWORK ONLINE · 412 SCREENS BROADCASTING</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:940}}">
class Component extends DCLogic {
  state = { pass: false, confirm: false };
  renderVals() {
    const { pass, confirm } = this.state;
    return {
      showPass: pass, showConfirm: confirm,
      passType: pass ? "text" : "password",
      confirmType: confirm ? "text" : "password",
      passEye: pass ? "#3ee6d1" : "#6b7382",
      confirmEye: confirm ? "#3ee6d1" : "#6b7382",
      togglePass: () => this.setState(s => ({ pass: !s.pass })),
      toggleConfirm: () => this.setState(s => ({ confirm: !s.confirm }))
    };
  }
}
</script>
</body>
</html>
